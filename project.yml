name: BrockwayRoversFootball
options:
  bundleIdPrefix: com.brockwayrovers
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  BrockwayRoversFootball:
    type: application
    platform: iOS
    sources:
      - BrockwayRoversFootball
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brockwayrovers.football
        PRODUCT_NAME: Brockway Rovers Football
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brockway Rovers
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
